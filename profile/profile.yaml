# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Built a simple Linux server monitoring system that collects host hardware details and tracks CPU and memory usage over time. Implemented Bash scripts where one script runs once to store static host information and another runs periodically to capture live usage metrics. Stored all data in a PostgreSQL database running inside Docker, enabling clean setup and easy management.Demonstrated practical integration of Linux, Bash scripting, Docker, Git, and PostgreSQL to deliver a basic monitoring solution."
  - name: "RDBMS and SQL"
    git_url: "/RDBMS_and_SQL"
    description: Designed and implemented a relational database using SQL and RDBMS principles based on a provided ERD. Created normalized tables for members, bookings, and facilities using SQL DDL with appropriate primary and foreign key constraints. Developed SQL queries to extract meaningful insights using joins, aggregations, filters, and window functions. Applied Git and GitHub for version control and change tracking.
  - name: "Python Data Analytics"
    git_url: "/python_data_analytics"
    description: Built a customer analytics PoC leveraging Python, Pandas, and PostgreSQL to perform RFM segmentation, revenue trend analysis, and cancellation pattern detection for targeted marketing optimization.
  - name: "BSA Fundamentals"
    git_url: None
    description: Authored a Business Requirements Document (BRD) for a Linux Cluster Monitoring project and conducted stakeholder elicitation sessions to gather requirements, translating them into a detailed Software Requirements Document (SRD) for a stock trading application.

